<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f89a0b">
<meta name="description" content="منيو مطعم تويتر - اطلب عبر واتساب">
<title>مطعم تويتر | TWITTER RESTAURANT</title>
<style>
:root{--orange:#f89a0b;--orange2:#e98300;--cream:#fff8ed;--ink:#21170d;--muted:#735f4b;--line:#ead4b0;--white:#fff}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:linear-gradient(#fffaf3,#f7e7cb);color:var(--ink);font-family:Tahoma,Arial,sans-serif}
button,input{font:inherit}
button{cursor:pointer}
.container{width:min(720px,calc(100% - 24px));margin:auto}
.hero{margin:12px auto 14px;background:var(--orange);border-radius:26px;overflow:hidden;box-shadow:0 12px 35px rgba(80,45,5,.13)}
.hero img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover}
.hero-info{padding:18px;text-align:center;color:#fff}
.hero-info h1{margin:0;font-size:28px}
.hero-info p{margin:7px 0 0;opacity:.92;letter-spacing:2px;font-size:12px;font-weight:700}
.search{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:#fff;font-size:16px;outline:none}
.search:focus{border-color:var(--orange)}
.categories{display:flex;gap:8px;overflow-x:auto;padding:12px 2px}
.categories::-webkit-scrollbar{height:4px}
.cat{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 15px;white-space:nowrap;color:#5b3918;font-weight:700}
.cat.active{background:var(--orange);border-color:var(--orange);color:#fff}
.section{margin:8px 0 18px}
.section-head{display:flex;align-items:center;gap:10px;margin:14px 2px 9px}
.section-head h2{font-size:20px;margin:0}
.section-head span{height:2px;background:#e8c990;flex:1}
.items{display:grid;gap:9px}
.item{background:rgba(255,255,255,.82);border:1px solid var(--line);border-radius:17px;padding:13px}
.item-top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.item-name{font-size:16px;font-weight:800}
.price{font-weight:900;color:var(--orange2);white-space:nowrap}
.item-actions{display:flex;gap:8px;margin-top:10px}
.add{flex:1;border:0;background:var(--orange);color:#fff;border-radius:11px;padding:10px;font-weight:800}
.wa{border:1px solid #c9ddc6;background:#f3faf1;color:#216e1e;border-radius:11px;padding:10px 12px;font-weight:800}
.cart{position:sticky;bottom:12px;margin:16px 0;z-index:5}
.cart-card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px rgba(50,30,10,.12);padding:12px}
.cart-row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.cart-title{font-weight:900}
.cart-count{background:var(--orange);color:#fff;border-radius:999px;padding:3px 9px;font-size:12px}
.cart-items{margin-top:10px;display:grid;gap:7px;max-height:190px;overflow:auto}
.cart-item{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.remove{border:0;background:transparent;color:#a33;padding:0}
.total{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:10px;padding-top:10px;font-weight:900}
.order{display:block;text-align:center;text-decoration:none;background:#25d366;color:#fff;border-radius:13px;padding:13px;margin-top:10px;font-weight:900}
.clear{width:100%;border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px;margin-top:8px}
.empty{text-align:center;color:var(--muted);padding:28px}
.note{text-align:center;color:var(--muted);font-size:11px;padding:5px 0 25px}
@media(min-width:600px){.items{grid-template-columns:1fr 1fr}.hero img{max-height:520px;object-fit:cover}}
</style>
</head>

const search=document.getElementById("search");

function render(){
 const q=search.value.trim().toLowerCase();
 const sections=products.filter(s=>active==="all"||s.cat===active).map(s=>{
   const list=s.items.filter(p=>p[0].toLowerCase().includes(q));
   if(!list.length) return "";
   return `<section class="section">
     <div class="section-head"><h2>${s.icon} ${s.section}</h2><span></span></div>
     <div class="items">
       ${list.map(p=>`
        <article class="item">
          <div class="item-top">
            <span class="item-name">${p[0]}</span>
            <span class="price">${money(p[1])}</span>
          </div>
          <div class="item-actions">
            <button class="add" type="button" onclick="addToCart('${p[0].replace(/'/g,"\\'")}',${p[1]})">＋ أضف للطلب</button>
            <button class="wa" type="button" onclick="orderOne('${p[0].replace(/'/g,"\\'")}',${p[1]})">واتساب</button>
          </div>
        </article>`).join("")}
     </div>
   </section>`;
 }).join("");
 menu.innerHTML=sections||'<div class="empty">ماكو نتائج مطابقة للبحث.</div>';
 document.querySelectorAll(".cat").forEach(b=>b.classList.toggle("active",b.dataset.cat===active));
}

function addToCart(name,price){
 cart[name]=(cart[name]||{price,qty:0});
 cart[name].qty++;
 renderCart();
}
function removeFromCart(name){
 if(!cart[name])return;
 cart[name].qty--;
 if(cart[name].qty<=0)delete cart[name];
 renderCart();
}
function renderCart(){
 const entries=Object.entries(cart);
 let total=0,count=0;
 const box=document.getElementById("cartItems");
 if(!entries.length){
   box.innerHTML='<div style="color:#735f4b;font-size:13px">السلة فارغة. أضف وجبة حتى ترسل الطلب.</div>';
 }else{
   box.innerHTML=entries.map(([name,x])=>{
     total+=x.price*x.qty;count+=x.qty;
     return `<div class="cart-item"><span>${name} × ${x.qty}</span><span>${money(x.price*x.qty)} <button class="remove" onclick="removeFromCart('${name.replace(/'/g,"\\'")}')" aria-label="حذف ${name}">✕</button></span></div>`;
   }).join("");
 }
 document.getElementById("count").textContent=count;
 document.getElementById("total").textContent=money(total);
 document.getElementById("totalTop").textContent=money(total);

 let message="السلام عليكم، أريد الطلب من مطعم تويتر:%0A";
 if(entries.length){
   entries.forEach(([name,x])=>message+=`• ${name} × ${x.qty} — ${x.price*x.qty} د.ع%0A`);
   message+=`%0Aالمجموع: ${total} د.ع`;
 }else{
   message+="أريد الاستفسار عن المنيو.";
 }
 document.getElementById("orderBtn").href=`https://wa.me/${WA}?text=${message}`;
}

function orderOne(name,price){
 const message=`السلام عليكم، أريد طلب:%0A• ${name} — ${money(price)}%0A%0Aمن مطعم تويتر`;
 window.open(`https://wa.me/${WA}?text=${message}`,"_blank");
}

document.getElementById("categories").addEventListener("click",e=>{
 const b=e.target.closest(".cat"); if(!b)return;
 active=b.dataset.cat; render();
});
search.addEventListener("input",render);
document.getElementById("clearBtn").addEventListener("click",()=>{
 cart={}; renderCart();
});
render();
renderCart();
</script>
</body>
</html>
